<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFF6F2">
  <meta name="description" content="A cosy planner with a bear, panda or cat buddy who cheers you on.">
  <title>Bear Buddy Planner</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Buddy">
  <meta name="format-detection" content="telephone=no">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="buddy.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="app" aria-live="polite"></div>
  <div id="sheet-root"></div>
  <div id="yt-root" class="yt" hidden></div>
  <div id="tour-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <canvas id="confetti" class="confetti" aria-hidden="true"></canvas>
  <script src="config.js"></script>
  <script src="buddy.js"></script>
  <script src="sounds.js"></script>
  <script src="app.js"></script>
</body>
</html>
